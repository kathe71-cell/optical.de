<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Canvas (Light Alabaster) -->
  <rect width="1200" height="675" fill="#f8fafc"/>

  <!-- Outer Card Frame -->
  <rect x="30" y="30" width="1140" height="615" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Section -->
  <text x="60" y="75" fill="#64748b" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.5">PROJEKT- &amp; ASSET-ÜBERSICHT</text>
  
  <text x="60" y="125" fill="#0f172a" font-size="44" font-weight="900" class="font-sans" letter-spacing="-0.5">optical<tspan fill="#94a3b8">.de</tspan></text>
  <text x="60" y="152" fill="#475569" font-size="15" font-weight="400" class="font-sans">Generische .de-Domain mit vollständiger Webapplikation (Augenoptik &amp; Sehhilfen)</text>

  <!-- Top Right Feature Tags -->
  <g transform="translate(680, 85)">
    <rect x="0" y="0" width="135" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="67" y="20" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">React 18 · Vite</text>

    <rect x="145" y="0" width="165" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="227" y="20" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">100% Zero-CDN (DSGVO)</text>

    <rect x="320" y="0" width="140" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="390" y="20" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Auth-Code Transfer</text>
  </g>

  <!-- Subtle Divider -->
  <line x1="60" y1="180" x2="1140" y2="180" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 4 FACT COLUMNS / CARDS -->

  <!-- Card 1: Domain-Asset -->
  <g transform="translate(60, 205)">
    <rect width="250" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="28" cy="28" r="4" fill="#0f172a"/>
    <text x="42" y="32" fill="#0f172a" font-size="12" font-weight="800" class="font-sans" letter-spacing="0.5">1. DOMAIN-ASSET</text>

    <text x="20" y="70" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Top-Level-Domain:</text>
    <text x="30" y="88" fill="#475569" font-size="11" class="font-sans">Offizielle deutsche Endung (.de)</text>

    <text x="20" y="122" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Generischer Begriff:</text>
    <text x="30" y="140" fill="#475569" font-size="11" class="font-sans">Zentrales Fachwort der Optik</text>

    <text x="20" y="174" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Schneller Umzug:</text>
    <text x="30" y="192" fill="#475569" font-size="11" class="font-sans">Sofortiger Transfer via Auth-Code</text>

    <text x="20" y="226" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Zielgruppe / Einsatz:</text>
    <text x="30" y="244" fill="#475569" font-size="11" class="font-sans">Händler, Optikerketten, Kliniken,</text>
    <text x="30" y="260" fill="#475569" font-size="11" class="font-sans">Verlage oder Vergleichsportale</text>
  </g>

  <!-- Card 2: Software-Module -->
  <g transform="translate(330, 205)">
    <rect width="250" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="28" cy="28" r="4" fill="#0f172a"/>
    <text x="42" y="32" fill="#0f172a" font-size="12" font-weight="800" class="font-sans" letter-spacing="0.5">2. SOFTWARE-MODULE</text>

    <text x="20" y="70" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Vergleichskatalog:</text>
    <text x="30" y="88" fill="#475569" font-size="11" class="font-sans">Tages-, Monats-, Torische und</text>
    <text x="30" y="104" fill="#475569" font-size="11" class="font-sans">Multifokale Linsen + Pflegemittel</text>

    <text x="20" y="136" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Filter-Engine:</text>
    <text x="30" y="154" fill="#475569" font-size="11" class="font-sans">Hersteller &amp; Optiker-Eigenmarken</text>

    <text x="20" y="186" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Spezifikations-Matrix:</text>
    <text x="30" y="204" fill="#475569" font-size="11" class="font-sans">Dk/t, Wassergehalt, Material &amp; Preis</text>

    <text x="20" y="236" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Interaktive Tools:</text>
    <text x="30" y="254" fill="#475569" font-size="11" class="font-sans">Bedarfs-Berater (Symptom-Filter)</text>
    <text x="30" y="270" fill="#475569" font-size="11" class="font-sans">&amp; Embed-Rechner (/rechner-embed)</text>
  </g>

  <!-- Card 3: Technik & Standards -->
  <g transform="translate(600, 205)">
    <rect width="250" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="28" cy="28" r="4" fill="#0f172a"/>
    <text x="42" y="32" fill="#0f172a" font-size="12" font-weight="800" class="font-sans" letter-spacing="0.5">3. TECHNIK &amp; SEO</text>

    <text x="20" y="70" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Frontend-Stack:</text>
    <text x="30" y="88" fill="#475569" font-size="11" class="font-sans">React 18, Vite &amp; Tailwind CSS</text>

    <text x="20" y="122" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• DSGVO &amp; Privacy:</text>
    <text x="30" y="140" fill="#475569" font-size="11" class="font-sans">System-Fonts, keine Drittanbieter,</text>
    <text x="30" y="156" fill="#475569" font-size="11" class="font-sans">cookielose Webanalyse</text>

    <text x="20" y="188" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Strukturierte Daten:</text>
    <text x="30" y="206" fill="#475569" font-size="11" class="font-sans">Schema.org JSON-LD (Product, FAQ)</text>

    <text x="20" y="238" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• AI-Ready Discovery:</text>
    <text x="30" y="256" fill="#475569" font-size="11" class="font-sans">public/llms.txt, RSS &amp; sitemap.xml</text>
  </g>

  <!-- Card 4: Lieferumfang & Übergabe -->
  <g transform="translate(870, 205)">
    <rect width="270" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="28" cy="28" r="4" fill="#0f172a"/>
    <text x="42" y="32" fill="#0f172a" font-size="12" font-weight="800" class="font-sans" letter-spacing="0.5">4. LIEFERUMFANG</text>

    <text x="20" y="70" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Domain-Inhaberwechsel:</text>
    <text x="30" y="88" fill="#475569" font-size="11" class="font-sans">Auth-Code für beliebigen Hoster</text>

    <text x="20" y="122" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Vollständiger Quellcode:</text>
    <text x="30" y="140" fill="#475569" font-size="11" class="font-sans">React 18 Projekt ohne Sperren</text>

    <text x="20" y="174" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Hosting-Optionen:</text>
    <text x="30" y="192" fill="#475569" font-size="11" class="font-sans">Vercel-Projekt-Transfer ODER</text>
    <text x="30" y="208" fill="#475569" font-size="11" class="font-sans">Webspace-Upload-ZIP (inkl. .htaccess)</text>

    <text x="20" y="240" fill="#0f172a" font-size="11" font-weight="700" class="font-sans">• Sichere Abwicklung:</text>
    <text x="30" y="258" fill="#475569" font-size="11" class="font-sans">Gern via Treuhand (Sedo / Escrow)</text>
  </g>

  <!-- Bottom Line & Information -->
  <line x1="60" y1="590" x2="1140" y2="590" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="60" y="616" fill="#94a3b8" font-size="12" class="font-sans">optical.de · Lauffähiges Projektasset (Domain &amp; Quellcode) · Stand: 2026</text>
  <text x="1140" y="616" fill="#475569" font-size="12" font-weight="600" text-anchor="end" class="font-sans">Kontakt &amp; Fragen per Direktnachricht</text>

</svg>
